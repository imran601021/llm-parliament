[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-parliament"
version = "0.2.0"
description = "Multi-agent debate for better AI decisions. Research-backed, local-first."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
authors = [{ name = "Boris Miscenco" }]
keywords = ["llm", "multi-agent", "debate", "ai", "ollama", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "openai>=1.0",     # also covers Ollama via custom base_url
    "click>=8.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "google-genai>=1.0",
    "httpx>=0.27",
    "psutil>=5.9",
    "keyring>=24.0",
    "windows-curses>=2.4; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # Upper bound is deliberate. Ruff 0.16 widened its default rule set (I,
    # RUF, PIE, S, SIM and more), which turns 97 pre-existing findings into
    # failures in one step -- see #30. Unpinned, "ruff check . is clean" means
    # something different on every machine and every week, and a contributor
    # cannot tell which findings are theirs. Lift this once #30 decides
    # whether to adopt the new defaults or declare the rule set explicitly.
    "ruff>=0.8,<0.16",
    "mypy>=1.0,<2.0",
    "types-PyYAML"
]

[project.scripts]
parliament = "parliament.cli:main"

[project.urls]
Homepage = "https://github.com/elarmuzik1993/llm-parliament"
Issues = "https://github.com/elarmuzik1993/llm-parliament/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/parliament"]

[tool.hatch.build.targets.sdist]
exclude = [
  ".cursor",
  "*.code-workspace",
  "docs/superpowers",
  ".github",
  "AGENTS.md",
  "CLAUDE.md",
  "GEMINI.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100


[tool.ruff.lint]
# Neither rule is in ruff's default set, so nothing enforced either before.
# B904: `ruff check .` was green while ten `raise`s inside `except` blocks
# discarded the error that caused them. Enforcing it is what stops an
# eleventh. I: import sorting, so the order stops being a matter of taste.

# `extend-select`, not `select`: this adds both rules to whatever ruff
# enforces by default rather than replacing it. `select = ["B904", "I"]` would
# pin the rule set to the four families ruff 0.8 defaulted to, silencing
# everything a newer ruff has learned since. That matters because the
# `ruff>=0.8,<0.16` dev pin above is deliberately temporary -- when #30 lifts
# it, `extend-select` picks the new defaults up and `select` would have
# hidden them.
extend-select = ["B904", "I"]

[tool.mypy]
ignore_missing_imports = true
